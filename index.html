<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>

<body>

  <!-- ============ AUTH SCREEN ============ -->
  <div class="auth-screen" id="authScreen">
    <div class="auth-header-card">
      <div class="auth-header-subtitle">Welcome to</div>
      <div class="auth-header-title">Transaction Tracker</div>
    </div>

    <div class="auth-tabs">
      <div class="auth-tab active" data-authtab="login">Log in</div>
      <div class="auth-tab" data-authtab="signup">Sign up</div>
    </div>

    <form class="auth-card" id="authForm">
      <label for="authEmail">Email</label>
      <input type="email" id="authEmail" class="auth-input" placeholder="you@example.com" autocomplete="email" required>

      <label for="authPassword">Password</label>
      <input type="password" id="authPassword" class="auth-input" placeholder="••••••••" autocomplete="current-password" required>

      <div class="auth-error-msg" id="authErrorMsg"></div>
      <div class="auth-success-msg" id="authSuccessMsg"></div>

      <button type="submit" class="auth-submit-btn" id="authSubmitBtn">Log in</button>
    </form>
  </div>

  <!-- ============ MAIN APP (hidden until logged in) ============ -->
  <div class="app" id="mainApp" style="display:none;">
    <div class="balance-card">
      <button class="logout-btn" id="logoutBtn">Log out</button>
      <div class="balance-label">Current balance</div>
      <div class="balance-amount" id="balance">₹0.00</div>
      <div class="balance-sub">
        <span>Credited<b id="totalCredit">₹0.00</b></span>
        <span>Debited<b id="totalDebit">₹0.00</b></span>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="add">Add entry</div>
      <div class="tab" data-tab="history">History</div>
    </div>

    <div class="panel-wrap">
      <div class="panel active" id="panel-add">
        <div class="card">
          <label for="amount">Amount</label>
          <input type="number" id="amount" placeholder="0.00" step="0.01" inputmode="decimal">

          <label for="note">Note (optional)</label>
          <input type="text" id="note" placeholder="e.g. Freelance payment, groceries">

          <div class="error-msg" id="errorMsg">Enter a valid amount !</div>

          <div class="type-toggle transaction-actions">
            <button class="type-btn credit" id="btnCredit">Credit amount</button>
            <button class="type-btn debit" id="btnDebit">Debit amount</button>
          </div>
        </div>
      </div>

      <div class="panel" id="panel-history">
        <div class="filter-row">
          <select id="filterType">
            <option value="all">All types</option>
            <option value="credit">Credit only</option>
            <option value="debit">Debit only</option>
          </select>
          <select id="filterDate">
            <option value="all">All time</option>
            <option value="today">Today</option>
            <option value="week">Last 7 days</option>
            <option value="month">Last 30 days</option>
          </select>
        </div>
        <button class="export-btn" id="exportBtn">Export to CSV</button>
        <div id="historyList">
          <div class="empty-state">Loading...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="editModal">
    <div class="modal-card">
      <div class="modal-title">Edit transaction</div>
      <div class="type-toggle">
        <button class="type-btn credit" id="editBtnCredit">Credit</button>
        <button class="type-btn debit" id="editBtnDebit">Debit</button>
      </div>
      <label for="editAmount">Amount</label>
      <input type="number" id="editAmount" step="0.01" inputmode="decimal">
      <label for="editNote">Note</label>
      <input type="text" id="editNote">
      <div class="error-msg" id="editErrorMsg">Enter a valid amount</div>
      <button class="submit-btn" id="saveEditBtn">Save changes</button>
      <button class="cancel-btn" id="cancelEditBtn">Cancel</button>
    </div>
  </div>

  <script>
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let editType = 'credit';
    let editId = null;
    let transactions = [];

    // ---------- Auth elements ----------
    const authScreen = document.getElementById('authScreen');
    const mainApp = document.getElementById('mainApp');
    const authTabs = document.querySelectorAll('[data-authtab]');
    const authForm = document.getElementById('authForm');
    const authEmail = document.getElementById('authEmail');
    const authPassword = document.getElementById('authPassword');
    const authErrorMsg = document.getElementById('authErrorMsg');
    const authSuccessMsg = document.getElementById('authSuccessMsg');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    let authMode = 'login';

    function setAuthMode(mode) {
      authMode = mode;
      authTabs.forEach(t => {
        t.classList.toggle('active', t.dataset.authtab === mode);
      });
      authSubmitBtn.textContent = mode === 'login' ? 'Log in' : 'Sign up';
      authErrorMsg.style.display = 'none';
      authSuccessMsg.style.display = 'none';
    }

    authTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        setAuthMode(tab.dataset.authtab);
      });
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = authEmail.value.trim();
      const password = authPassword.value;

      authErrorMsg.style.display = 'none';
      authSuccessMsg.style.display = 'none';

      if (!email || !password) {
        authErrorMsg.textContent = 'Enter both email and password';
        authErrorMsg.style.display = 'block';
        return;
      }

      authSubmitBtn.disabled = true;
      authSubmitBtn.textContent = authMode === 'login' ? 'Logging in...' : 'Signing up...';

      try {
        if (authMode === 'login') {
          const { error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) {
            authErrorMsg.textContent = error.message;
            authErrorMsg.style.display = 'block';
          }
        } else {
          const { data, error } = await supabase.auth.signUp({ email, password });
          if (error) {
            authErrorMsg.textContent = error.message;
            authErrorMsg.style.display = 'block';
          } else {
            if (data.session) {
              currentUser = data.session.user;
            } else {
              authSuccessMsg.textContent = 'Account created! Check your email to confirm your account, then log in.';
              authSuccessMsg.style.display = 'block';
              authPassword.value = '';
              setAuthMode('login');
            }
          }
        }
      } catch (err) {
        authErrorMsg.textContent = err.message || 'An unexpected error occurred.';
        authErrorMsg.style.display = 'block';
      } finally {
        authSubmitBtn.disabled = false;
        authSubmitBtn.textContent = authMode === 'login' ? 'Log in' : 'Sign up';
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await supabase.auth.signOut();
    });

    supabase.auth.onAuthStateChange((_event, session) => {
      if (session) {
        currentUser = session.user;
        authScreen.style.display = 'none';
        mainApp.style.display = 'block';
        loadTransactions();
      } else {
        currentUser = null;
        authScreen.style.display = 'block';
        mainApp.style.display = 'none';
      }
    });

    // Check for an existing session on page load
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        currentUser = session.user;
        authScreen.style.display = 'none';
        mainApp.style.display = 'block';
        loadTransactions();
      }
    })();

    // ---------- Main app elements ----------
    const btnCredit = document.getElementById('btnCredit');
    const btnDebit = document.getElementById('btnDebit');
    const amountInput = document.getElementById('amount');
    const noteInput = document.getElementById('note');
    const errorMsg = document.getElementById('errorMsg');
    const historyList = document.getElementById('historyList');
    const filterType = document.getElementById('filterType');
    const filterDate = document.getElementById('filterDate');
    const exportBtn = document.getElementById('exportBtn');

    const editModal = document.getElementById('editModal');
    const editBtnCredit = document.getElementById('editBtnCredit');
    const editBtnDebit = document.getElementById('editBtnDebit');
    const editAmount = document.getElementById('editAmount');
    const editNote = document.getElementById('editNote');
    const editErrorMsg = document.getElementById('editErrorMsg');
    const saveEditBtn = document.getElementById('saveEditBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');

    editBtnCredit.addEventListener('click', () => {
      editType = 'credit';
      editBtnCredit.classList.add('selected');
      editBtnDebit.classList.remove('selected');
    });
    editBtnDebit.addEventListener('click', () => {
      editType = 'debit';
      editBtnDebit.classList.add('selected');
      editBtnCredit.classList.remove('selected');
    });

    const tabOrder = ['add', 'history'];
    document.querySelectorAll('#mainApp .tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const current = document.querySelector('.panel.active').id.replace('panel-', '');
        const target = tab.dataset.tab;
        if (current === target) return;

        const dir = tabOrder.indexOf(target) > tabOrder.indexOf(current) ? 'right' : 'left';

        document.querySelectorAll('#mainApp .tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        const currentPanel = document.getElementById('panel-' + current);
        const targetPanel = document.getElementById('panel-' + target);

        currentPanel.classList.remove('active');
        currentPanel.classList.add(dir === 'right' ? 'leaving-left' : 'leaving-right');

        setTimeout(() => {
          currentPanel.classList.remove('leaving-left', 'leaving-right');
          targetPanel.classList.add('active', dir === 'right' ? 'entering-right' : 'entering-left');
          setTimeout(() => {
            targetPanel.classList.remove('entering-left', 'entering-right');
          }, 320);
        }, 220);
      });
    });

    // ---------- Supabase-backed data layer ----------
    async function loadTransactions() {
      if (!currentUser) return;
      historyList.innerHTML = '<div class="empty-state">Loading...</div>';

      const { data, error } = await supabase
        .from('transactions')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Failed to load transactions', error);
        transactions = [];
      } else {
        transactions = data.map(row => ({
          id: row.id,
          type: row.type,
          amount: parseFloat(row.amount),
          note: row.note,
          timestamp: new Date(row.created_at).getTime()
        }));
      }
      render();
    }

    function formatMoney(n) {
      return '₹' + n.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatDay(date) {
      const today = new Date();
      const d = new Date(date);
      const isToday = d.toDateString() === today.toDateString();
      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);
      const isYesterday = d.toDateString() === yesterday.toDateString();
      if (isToday) return 'Today';
      if (isYesterday) return 'Yesterday';
      return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function formatTime(date) {
      return new Date(date).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
    }

    function getFilteredTransactions() {
      let list = [...transactions];
      const type = filterType.value;
      const dateRange = filterDate.value;

      if (type !== 'all') {
        list = list.filter(t => t.type === type);
      }

      if (dateRange !== 'all') {
        const now = Date.now();
        const dayMs = 24 * 60 * 60 * 1000;
        let cutoff;
        if (dateRange === 'today') {
          const startOfDay = new Date();
          startOfDay.setHours(0, 0, 0, 0);
          cutoff = startOfDay.getTime();
        } else if (dateRange === 'week') {
          cutoff = now - 7 * dayMs;
        } else if (dateRange === 'month') {
          cutoff = now - 30 * dayMs;
        }
        list = list.filter(t => t.timestamp >= cutoff);
      }

      return list.sort((a, b) => b.timestamp - a.timestamp);
    }

    function render() {
      let credit = 0, debit = 0;
      transactions.forEach(t => {
        if (t.type === 'credit') credit += t.amount;
        else debit += t.amount;
      });
      const balance = credit - debit;
      document.getElementById('balance').textContent = formatMoney(balance);
      document.getElementById('totalCredit').textContent = formatMoney(credit);
      document.getElementById('totalDebit').textContent = formatMoney(debit);

      const filtered = getFilteredTransactions();

      if (transactions.length === 0) {
        historyList.innerHTML = '<div class="empty-state">No transactions yet. Add your first one from the Add entry tab.</div>';
        return;
      }
      if (filtered.length === 0) {
        historyList.innerHTML = '<div class="empty-state">No transactions match these filters.</div>';
        return;
      }

      let html = '';
      let lastDay = null;
      filtered.forEach(t => {
        const day = formatDay(t.timestamp);
        if (day !== lastDay) {
          html += `<div class="history-day">${day}</div>`;
          lastDay = day;
        }
        const sign = t.type === 'credit' ? '+' : '-';
        const icon = t.type === 'credit' ? '↓' : '↑';
        html += `
      <div class="txn-item ${t.type}">
        <div class="txn-icon">${icon}</div>
        <div class="txn-info">
          <div class="txn-note">${t.note || (t.type === 'credit' ? 'Credit' : 'Debit')}</div>
          <div class="txn-time">${formatTime(t.timestamp)}</div>
        </div>
        <div class="txn-amount">${sign}${formatMoney(t.amount)}</div>
        <div class="txn-actions">
          <button class="txn-btn" data-edit="${t.id}" aria-label="Edit transaction">✎</button>
          <button class="txn-btn" data-delete="${t.id}" aria-label="Delete transaction">×</button>
        </div>
      </div>`;
      });
      historyList.innerHTML = html;

      historyList.querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.delete;
          const { error } = await supabase.from('transactions').delete().eq('id', id);
          if (error) {
            console.error('Failed to delete', error);
            return;
          }
          transactions = transactions.filter(t => t.id !== id);
          render();
        });
      });

      historyList.querySelectorAll('[data-edit]').forEach(btn => {
        btn.addEventListener('click', () => openEditModal(btn.dataset.edit));
      });
    }

    function openEditModal(id) {
      const txn = transactions.find(t => t.id === id);
      if (!txn) return;
      editId = id;
      editType = txn.type;
      editAmount.value = txn.amount;
      editNote.value = txn.note || '';
      editErrorMsg.style.display = 'none';
      if (editType === 'credit') {
        editBtnCredit.classList.add('selected');
        editBtnDebit.classList.remove('selected');
      } else {
        editBtnDebit.classList.add('selected');
        editBtnCredit.classList.remove('selected');
      }
      editModal.classList.add('active');
    }

    cancelEditBtn.addEventListener('click', () => {
      editModal.classList.remove('active');
      editId = null;
    });

    saveEditBtn.addEventListener('click', async () => {
      const amount = parseFloat(editAmount.value);
      if (!amount || amount <= 0) {
        editErrorMsg.style.display = 'block';
        return;
      }
      editErrorMsg.style.display = 'none';
      const roundedAmount = Math.round(amount * 100) / 100;
      const noteVal = editNote.value.trim();

      const { error } = await supabase
        .from('transactions')
        .update({ type: editType, amount: roundedAmount, note: noteVal })
        .eq('id', editId);

      if (error) {
        console.error('Failed to update', error);
        editErrorMsg.textContent = 'Could not save changes';
        editErrorMsg.style.display = 'block';
        return;
      }

      const txn = transactions.find(t => t.id === editId);
      if (txn) {
        txn.type = editType;
        txn.amount = roundedAmount;
        txn.note = noteVal;
        render();
      }
      editModal.classList.remove('active');
      editId = null;
    });

    filterType.addEventListener('change', render);
    filterDate.addEventListener('change', render);

    exportBtn.addEventListener('click', () => {
      const list = getFilteredTransactions();
      if (list.length === 0) return;
      let csv = 'Date,Time,Type,Amount,Note\n';
      list.forEach(t => {
        const d = new Date(t.timestamp);
        const dateStr = d.toLocaleDateString('en-IN');
        const timeStr = formatTime(t.timestamp);
        const note = (t.note || '').replace(/"/g, '""');
        csv += `${dateStr},${timeStr},${t.type},${t.amount},"${note}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'transactions.csv';
      a.click();
      URL.revokeObjectURL(url);
    });

    async function addTransaction(type) {
      if (!currentUser) return;
      const amount = parseFloat(amountInput.value);
      if (!amount || amount <= 0) {
        errorMsg.style.display = 'block';
        return;
      }
      errorMsg.style.display = 'none';

      const { data, error } = await supabase
        .from('transactions')
        .insert({
          user_id: currentUser.id,
          type,
          amount: Math.round(amount * 100) / 100,
          note: noteInput.value.trim()
        })
        .select()
        .single();

      if (error) {
        console.error('Failed to add transaction', error);
        errorMsg.textContent = 'Could not save transaction';
        errorMsg.style.display = 'block';
        return;
      }

      transactions.push({
        id: data.id,
        type: data.type,
        amount: parseFloat(data.amount),
        note: data.note,
        timestamp: new Date(data.created_at).getTime()
      });

      amountInput.value = '';
      noteInput.value = '';
      render();

      document.querySelector('#mainApp .tab[data-tab="history"]').click();
    }

    btnCredit.addEventListener('click', () => addTransaction('credit'));
    btnDebit.addEventListener('click', () => addTransaction('debit'));

    amountInput.addEventListener('input', () => {
      errorMsg.style.display = 'none';
    });
  </script>
</body>

</html>
